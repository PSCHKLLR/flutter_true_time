version: 0.1.0-dev.1
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_true_time:
    path: ../
dev_dependencies:
