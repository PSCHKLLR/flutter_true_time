name: Published package smoke tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/published-package.yml'
      - '.github/scripts/release*'
      - 'example/**'
  pull_request:
    paths:
      - '.github/workflows/published-package.yml'
      - '.github/scripts/release*'
      - 'example/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact consumer version (blank selects latest stable from pub.dev)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        description: 'Reusable publication mode; callers must retain the true default'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s .github/scripts -p 'release_test.py'
      - name: Freeze published versions for both SDKs
        id: select
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_SMOKE: ${{ inputs.release || false }}
        run: python3 .github/scripts/release.py smoke-versions

  smoke:
    needs: versions
    name: smoke (${{ matrix.package.lane }}, ${{ matrix.flutter }}, ${{ matrix.package.version }})
    timeout-minutes: 15
    continue-on-error: ${{ matrix.package.advisory }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.41.0', '3.47.9']
        package: ${{ fromJSON(needs.versions.outputs.lanes) }}
    env:
      PUBLISHED_VERSION: ${{ matrix.package.version }}
    steps:
      - name: Report tested version and failure policy
        env:
          LANE: ${{ matrix.package.lane }}
          ADVISORY: ${{ matrix.package.advisory }}
        run: |
          echo "### $LANE / Flutter ${{ matrix.flutter }}" >> "$GITHUB_STEP_SUMMARY"
          echo "flutter_true_time $PUBLISHED_VERSION; advisory=$ADVISORY" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
      - name: Install the published package in an isolated example
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cp -R example/lib example/test example/integration_test "$consumer/"
          awk -v version="$PUBLISHED_VERSION" '
            /^  flutter_true_time:$/ {
              if (getline != 1 || $0 != "    path: ../") exit 1
              print "  flutter_true_time: " version
              count++
              next
            }
            { print }
            END { if (count != 1) exit 1 }
          ' example/pubspec.yaml > "$consumer/pubspec.yaml"
          cd "$consumer"
          python3 "$GITHUB_WORKSPACE/.github/scripts/release.py" resolve "$PUBLISHED_VERSION"
          flutter pub deps --json | jq -e --arg version "$PUBLISHED_VERSION" '
            any(.packages[]; .name == "flutter_true_time" and
                .version == $version and .source == "hosted")
          '
          flutter test --no-pub --reporter expanded
