name: Publish package and GitHub Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - '.github/workflows/compatibility.yml'
      - '.github/workflows/published-package.yml'
      - '.github/scripts/release*'
      - '.github/scripts/android_build*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ startsWith(github.ref, 'refs/tags/') && 'publication' || github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
      prerelease: ${{ steps.package.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s .github/scripts -p '*_test.py'
      - name: Validate package, changelog, and tag
        id: package
        run: python3 .github/scripts/release.py metadata
      - name: Require the tagged commit to be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main

  dry-run:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: dart pub get --example
      - run: dart pub publish --dry-run

  compatibility:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/compatibility.yml
    with:
      strict: true

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [metadata, dry-run, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      # setup-dart configures short-lived pub.dev OIDC credentials.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.7'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: dart pub get --example
      - run: dart pub publish --dry-run
      - run: dart pub publish --force
  registry:
    needs: [metadata, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Confirm registry availability
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 .github/scripts/release.py verify "$PACKAGE_VERSION"

  consumers:
    needs: [metadata, registry]
    uses: ./.github/workflows/published-package.yml
    with:
      version: ${{ needs.metadata.outputs.version }}

  github-release:
    needs: [metadata, consumers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 .github/scripts/release.py metadata
      - name: Create GitHub Release after publication and consumer checks
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        shell: bash
        run: |
          tag="v$PACKAGE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          latest=$(curl --fail --silent --show-error --retry 3 https://pub.dev/api/packages/flutter_true_time | jq -r .latest.version)
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --notes-file .dart_tool/release-notes.md)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          elif [[ "$PACKAGE_VERSION" == "$latest" ]]; then
            args+=(--latest)
          else
            args+=(--latest=false)
          fi
          gh release create "$tag" "${args[@]}"
